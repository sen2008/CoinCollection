name: Publish archive

# Deploys the encrypted site in docs/ to GitHub Pages.
#
# The build itself happens on Lucas's machine, not here: this repository is
# public and holds no part of the collection, so there is nothing for CI to
# encrypt. Run build_site.py locally, commit docs/, and this publishes it.
#
# Nothing secret is needed. The passphrase never reaches GitHub.

on:
  push:
    branches: [main]
    # Only a change to the encrypted site republishes. Editing this workflow
    # does not redeploy content; use workflow_dispatch for that.
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than publishing a half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # This repository is public, so a readable docs/ would put the collection
      # on the open internet. Refuse rather than publish it.
      - name: Refuse to publish anything readable
        run: |
          if [ ! -s docs/app.bin ] || [ ! -s docs/index.html ]; then
            echo "::error::docs/ is missing or incomplete. Run build_site.py and commit docs/."
            exit 1
          fi
          if grep -qa 'THUMBS\|<!DOCTYPE html>' docs/app.bin; then
            echo "::error::docs/app.bin is not encrypted. Refusing to publish."
            exit 1
          fi
          # index.html is the unlock page and is meant to be readable. Nothing else is.
          if find docs -type f ! -name 'index.html' ! -name '.nojekyll' \
               ! -name '*.bin' -print -quit | grep -q .; then
            echo "::error::docs/ contains files that are neither the unlock page nor ciphertext:"
            find docs -type f ! -name 'index.html' ! -name '.nojekyll' ! -name '*.bin'
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
