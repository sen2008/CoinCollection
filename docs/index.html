<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coin &amp; Currency Archive</title>
<style>
:root{
  --felt:#2A362F;
  --felt-deep:#1E2823;
  --felt-rail:#38463D;
  --card:#F4F1E6;
  --card-edge:#DED8C6;
  --ink:#17140F;
  --ink-soft:#5C564A;
  --red:#A8322A;
  --brass:#C08A2E;
  --silver:#A8B0B2;
  --f-data:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --f-body:Georgia,"Iowan Old Style","Times New Roman",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--felt);
  background-image:radial-gradient(circle at 50% 0%,rgba(255,255,255,.05),transparent 60%);
  color:var(--card);
  font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.gate{
  width:100%;max-width:380px;
  background:var(--felt-deep);
  border:1px solid var(--felt-rail);
  border-radius:4px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  padding:30px 28px 24px;
}
.crest{
  width:44px;height:44px;margin:0 auto 18px;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#E4B860,var(--brass) 55%,#7C5716);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.4);
}
h1{
  margin:0;text-align:center;
  font-family:var(--f-data);font-size:13px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
}
.sub{
  margin:10px 0 24px;text-align:center;
  font-family:var(--f-body);font-size:14px;line-height:1.5;
  color:var(--silver);
}
label{
  display:block;margin-bottom:6px;
  font-family:var(--f-data);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--silver);
}
input{
  width:100%;
  background:var(--felt);
  border:1px solid var(--felt-rail);
  border-radius:3px;
  padding:11px 12px;
  font-family:var(--f-data);font-size:14px;
  color:var(--card);
}
input:disabled{opacity:.55}
button{
  width:100%;margin-top:14px;
  background:var(--brass);border:0;border-radius:3px;
  padding:11px 12px;
  font-family:var(--f-data);font-size:12px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);cursor:pointer;
}
button:hover:not(:disabled){background:#D29B3B}
button:disabled{cursor:default;opacity:.55}

.msg{
  margin:16px 0 0;min-height:1.4em;
  font-family:var(--f-data);font-size:11.5px;line-height:1.4;
  letter-spacing:.04em;color:var(--silver);
}
.msg.err{color:#E0776C}
.msg.busy::after{
  content:"";display:inline-block;
  width:6px;height:6px;margin-left:7px;border-radius:50%;
  background:var(--brass);
  animation:pulse .9s ease-in-out infinite;
  vertical-align:middle;
}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.msg.busy::after{animation:none;opacity:.7}}

.note{
  margin:22px 0 0;padding-top:16px;
  border-top:1px solid var(--felt-rail);
  font-family:var(--f-body);font-size:12.5px;line-height:1.5;
  color:var(--ink-soft);
}
</style>
</head>
<body>

<main class="gate">
  <div class="crest" aria-hidden="true"></div>
  <h1>Coin &amp; Currency Archive</h1>
  <p class="sub">The catalogue is encrypted. Enter the passphrase to unlock it.</p>

  <form id="form">
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password"
           spellcheck="false" autocapitalize="off" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>

  <p id="msg" class="msg" role="status" aria-live="polite"></p>

  <p class="note">Decryption happens in this browser. The passphrase is never
     sent anywhere, and the server only ever holds the encrypted files.</p>
</main>

<script>
/*
 * Everything here lives inside this function on purpose. document.open() clears
 * the document but not the global lexical scope, so any top-level const or let
 * declared here would survive into the catalogue and collide with its own
 * declarations — a SyntaxError that stops the catalogue's script dead. window
 * properties are the only thing deliberately handed across; see window.VAULT.
 */
(function(){
"use strict";

const CONFIG = {
  salt: "512037375777b18b056e914f8fbc63d8",
  iterations: 600000,
  app: "app.bin",
  photoDir: "p/"
};

const MIME = {
  jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png",
  webp:"image/webp", gif:"image/gif", heic:"image/heic", tif:"image/tiff", tiff:"image/tiff"
};

const $ = s => document.querySelector(s);
const form = $("#form"), pw = $("#pw"), go = $("#go"), msg = $("#msg");

function say(text, kind){
  msg.textContent = text;
  msg.classList.toggle("err", kind === "err");
  msg.classList.toggle("busy", kind === "busy");
}

/* Let the browser paint the status line before a blocking crypto step. */
const painted = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const unhex = h => Uint8Array.from(h.match(/../g) || [], b => parseInt(b, 16));

async function deriveKey(passphrase, saltHex){
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:unhex(saltHex || CONFIG.salt),
      iterations:CONFIG.iterations, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt", "encrypt"]);
}

/* Every file is stored as a 12-byte nonce followed by AES-256-GCM ciphertext. */
async function decrypt(key, buffer){
  const bytes = new Uint8Array(buffer);
  return crypto.subtle.decrypt(
    { name:"AES-GCM", iv:bytes.subarray(0, 12) }, key, bytes.subarray(12));
}

async function encrypt(key, plaintext){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const body = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, plaintext));
  const out = new Uint8Array(iv.length + body.length);
  out.set(iv); out.set(body, iv.length);
  return out;
}

/* Chunked: String.fromCharCode(...bytes) overflows the stack on a payload this size. */
function b64(bytes){
  let s = "";
  for(let i = 0; i < bytes.length; i += 0x8000){
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

/*
 * Deliberately the default cache mode. Rebuilding under a new passphrase changes
 * the salt in this page and every encrypted file with it; a forced cache hit
 * would pair a fresh salt with a stale app.bin and report a perfectly good
 * passphrase as wrong. Revalidating against the ETag keeps the two in step.
 */
async function grab(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(res.status + " " + res.statusText);
  return res.arrayBuffer();
}

/*
 * Handed to the catalogue on window.VAULT once the passphrase is known.
 * The catalogue's drawer shows the embedded thumbnail immediately and calls
 * plate() to swap in the full-resolution photograph as it decrypts.
 */
function makeVault(key){
  const cache = new Map();
  return {
    photo(name){
      let pending = cache.get(name);
      if(!pending){
        pending = (async () => {
          const plain = await decrypt(key, await grab(CONFIG.photoDir + encodeURIComponent(name) + ".bin"));
          const ext = name.split(".").pop().toLowerCase();
          return URL.createObjectURL(new Blob([plain], { type: MIME[ext] || "application/octet-stream" }));
        })();
        cache.set(name, pending);
        pending.catch(() => cache.delete(name));
      }
      return pending;
    },
    /*
     * Wired up by the catalogue once it has booted, when the build embedded a
     * Worker address. The Worker only ever holds ciphertext: records are sealed
     * here, under the same key that opened the archive.
     */
    async attach(archive){
      const cfg = window.ARCHIVE_SYNC;
      if(!cfg || !cfg.url) return;

      const btn = document.getElementById("bSync");
      const out = document.getElementById("syncMsg");
      const say = (text, bad) => {
        if(!out) return;
        out.textContent = text;
        out.style.color = bad ? "#E0776C" : "";
      };
      const when = iso => { try { return new Date(iso).toLocaleString(); } catch { return iso; } };

      let version = 0;
      let writeToken = null;   // unsealed once per tab, by the write passphrase

      const api = (method, token, body) => fetch(cfg.url + "/records", {
        method,
        cache: "no-store",
        headers: Object.assign(
          { authorization: "Bearer " + token },
          body ? { "content-type": "application/json" } : {}),
        body: body ? JSON.stringify(body) : undefined
      });

      /*
       * The write token sits in the page sealed under a second passphrase, so
       * unlocking the archive to read it is not enough to save. Asked for once
       * per tab, then held in memory.
       */
      function askForWritePassphrase(){
        return new Promise(resolve => {
          out.textContent = "";
          const field = document.createElement("input");
          field.type = "password";
          field.placeholder = "Write passphrase";
          field.autocomplete = "off";
          field.spellcheck = false;
          field.style.cssText = "width:15em;margin-right:6px;background:#2A362F;"
            + "border:1px solid #38463D;border-radius:3px;padding:5px 7px;"
            + "font:inherit;color:#F4F1E6";
          const ok = document.createElement("button");
          ok.className = "btn";
          ok.textContent = "Unlock saving";
          const cancel = document.createElement("button");
          cancel.className = "btn";
          cancel.textContent = "Cancel";
          out.append(field, ok, cancel);
          field.focus();

          const done = value => { out.textContent = ""; resolve(value); };
          cancel.onclick = () => done(null);
          ok.onclick = async () => {
            if(!field.value) return;
            ok.disabled = cancel.disabled = field.disabled = true;
            try {
              const key = await deriveKey(field.value, cfg.salt);
              const token = new TextDecoder().decode(
                await decrypt(key, unb64(cfg.writer).buffer));
              done(token);
            } catch (err) {
              ok.disabled = cancel.disabled = field.disabled = false;
              field.value = "";
              field.focus();
              field.placeholder = "Not that one — try again";
            }
          };
          field.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); ok.click(); } };
        });
      }

      try {
        say("Loading the latest…");
        const res = await api("GET", cfg.readToken);
        if(res.status === 404){
          say("No saved edits yet — showing the published copy");
        } else if(!res.ok){
          throw new Error("HTTP " + res.status);
        } else {
          const stored = await res.json();
          const plain = await decrypt(key, unb64(stored.blob).buffer);
          archive.replace(JSON.parse(new TextDecoder().decode(plain)));
          version = stored.version;
          say("Up to date · saved " + when(stored.updated));
        }
      } catch (err) {
        // The published copy is already on screen, so this is not fatal.
        say("Could not reach the archive — showing the published copy", true);
      }

      if(!btn) return;
      btn.onclick = async () => {
        if(!writeToken){
          const token = await askForWritePassphrase();
          if(!token){ say("Not saved"); return; }
          writeToken = token;
        }
        btn.disabled = true;
        say("Saving…");
        try {
          const plain = new TextEncoder().encode(JSON.stringify(archive.items));
          const res = await api("PUT", writeToken, { version, blob: b64(await encrypt(key, plain)) });
          if(res.status === 409){
            const other = await res.json();
            say("Someone else saved at " + when(other.updated) + " — reload before saving", true);
          } else if(res.status === 403){
            writeToken = null;
            say("That passphrase does not grant saving", true);
          } else if(!res.ok){
            throw new Error("HTTP " + res.status);
          } else {
            const done = await res.json();
            version = done.version;
            say("Saved · " + when(done.updated));
          }
        } catch (err) {
          say("Save failed: " + err.message, true);
        }
        btn.disabled = false;
      };
    },

    async plate(img){
      const name = img && img.dataset.plate;
      if(!name) return;
      try {
        const url = await this.photo(name);
        if(img.isConnected) img.src = url;
      } catch (err) {
        /* No plate available — the embedded thumbnail stays on screen. */
      }
    }
  };
}

function fail(text){
  say(text, "err");
  pw.disabled = go.disabled = false;
  pw.select();
  pw.focus();
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  if(!pw.value || go.disabled) return;

  pw.disabled = go.disabled = true;
  say("Checking the passphrase…", "busy");
  await painted();

  let key;
  try {
    key = await deriveKey(pw.value);
  } catch (err) {
    return fail("Could not derive a key: " + err.message);
  }

  let payload;
  try {
    say("Fetching the catalogue…", "busy");
    payload = await grab(CONFIG.app);
  } catch (err) {
    return fail("Could not fetch the catalogue (" + err.message + ").");
  }

  let plain;
  try {
    say("Decrypting…", "busy");
    await painted();
    plain = await decrypt(key, payload);
  } catch (err) {
    return fail("That passphrase does not open this archive.");
  }

  const html = new TextDecoder().decode(plain);
  pw.value = "";
  window.VAULT = makeVault(key);

  /*
   * Replace this page with the catalogue in the same top-level document, so its
   * keyboard shortcuts, CSV download and unsaved-changes warning all behave
   * exactly as they do when the file is opened straight off disk. document.open()
   * clears the document but keeps the same window, so window.VAULT survives.
   */
  document.open();
  document.write(html);
  document.close();
});

if(!window.isSecureContext || !(window.crypto && crypto.subtle)){
  pw.disabled = go.disabled = true;
  say("This page must be served over HTTPS to decrypt the archive.", "err");
}
})();
</script>

</body>
</html>
